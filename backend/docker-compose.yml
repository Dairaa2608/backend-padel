# Levanta PostgreSQL para desarrollo: `docker compose up -d`
services:
  db:
    image: postgres:16
    container_name: padelzone-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: padel
      POSTGRES_PASSWORD: padel
      POSTGRES_DB: padelzone
    ports:
      - "5432:5432"
    volumes:
      - padelzone-data:/var/lib/postgresql/data

volumes:
  padelzone-data:
